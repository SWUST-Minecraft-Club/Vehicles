plugins { id 'xyz.jpenilla.run-paper' version '3.1.0' }
apply from: './gradle/plugin.gradle'
// 本插件独有的配置。
// 公共配置（Java 工具链、Folia API 依赖、仓库、processResources、Folia 测试服版本）
// 统一在仓库根目录的 build.gradle 里，改一次对所有插件生效。


dependencies {
    compileOnly files(rootProject.file('libs/MainMenu-mc26.3-plugin-1.10.1-beta.1.jar'))
    testImplementation "dev.folia:folia-api:${foliaApiVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
tasks.register('vehiclePack', Zip) {
    from 'assets/resourcepack'
    archiveFileName = "Vehicles-mc${minecraftVersion}-resourcepack-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('pack')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('processResources') {
    from(tasks.named('vehiclePack')) { rename { 'vehicles-resourcepack.zip' } }
}
sourceSets {
    integration { compileClasspath += sourceSets.main.output + configurations.compileClasspath }
}
tasks.register('vehicleIntegrationJar', Jar) {
    dependsOn tasks.named('integrationClasses')
    archiveBaseName = 'TestPluginVehicles'
    archiveVersion = ''
    from sourceSets.integration.output
}
tasks.register('archivePack', Copy) {
    dependsOn tasks.named('vehiclePack')
    from tasks.named('vehiclePack')
    into rootProject.file('release/Vehicles')
}
tasks.named('build') { finalizedBy 'archivePack' }
